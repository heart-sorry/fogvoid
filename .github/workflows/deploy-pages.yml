name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Gist Token
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "::warning::GIST_TOKEN secret is empty or not set"
          else
            echo "Token found, length: ${#GIST_TOKEN}"
            sed -i "s/const GIST_TOKEN = ''/const GIST_TOKEN = '$GIST_TOKEN'/" index.html
          fi
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Debug checkout
        run: |
          echo "=== Files in repo ==="
          ls -la
          echo "=== index.html first 3 lines ==="
          head -3 index.html || echo "No index.html!"
          echo "=== File sizes ==="
          find . -type f -exec ls -la {} \; | head -20

      - name: Setup Pages
        id: pages-setup
        uses: actions/configure-pages@v4

      - name: Debug Pages Setup
        run: |
          echo "Pages URL: ${{ steps.pages-setup.outputs.pages_url }}"
          echo "Pages Domain: ${{ steps.pages-setup.outputs.pages_domain }}"

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Debug artifact
        run: |
          echo "Upload output: ${{ steps.upload.outputs.artifact_id }}"
          echo "Upload name: ${{ steps.upload.outputs.artifact_name }}"
          echo "Upload path: ${{ steps.upload.outputs.artifact_path }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
