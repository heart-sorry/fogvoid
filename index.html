<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>致我们 💌</title>
  <style>
    /* ===================== 全局/背景 ===================== */
    *, p, a { text-decoration: none; transition: 0.3s; }

    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      background-color: #1a1a2e;
      overflow: hidden;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* 自定义光标 */
    a, button, .card, .result-item, .mood-btn,
    .music-player, .quiz-section, .curtain, .admin-link-btn {
      cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' width='10px' height='10px'><circle cx='4' cy='4' r='4' fill='white' /></svg>") 4 4, auto;
    }

    /* ===================== 背景层 ===================== */
    .bg-all {
      z-index: -1;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(120, 80, 200, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(255, 100, 130, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(80, 130, 255, 0.1) 0%, transparent 55%),
        linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
    }

    /* 背景装饰圆 */
    .bg-deco {
      position: fixed; border-radius: 50%;
      filter: blur(60px); opacity: 0.25;
      pointer-events: none; z-index: -1;
    }
    .bg-deco-1 { width: 300px; height: 300px; top: -80px; left: -60px; background: #667eea; }
    .bg-deco-2 { width: 250px; height: 250px; bottom: -60px; right: -40px; background: #f093fb; }
    .bg-deco-3 { width: 180px; height: 180px; top: 40%; left: 40%; background: #38ef7d; }

    /* ===================== 整体布局 ===================== */
    .layout {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ===================== 顶部导航 (PC+Mobile 共用) ===================== */
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      position: relative; z-index: 10;
    }
    .topbar-title {
      font-size: 1.1rem; color: #fff;
      font-weight: 600; letter-spacing: 0.05em;
      text-shadow: 0 0 20px rgba(120,80,255,0.6);
    }
    .topbar-title span { color: #f8a5c2; }

    /* 移动端：顶部时间/问候 */
    .topbar-greeting-mobile {
      display: none;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
    }

    /* 汉堡菜单按钮 */
    .menu-btn {
      display: none;
      background: none; border: none;
      color: #fff; font-size: 1.3rem;
      padding: 6px; cursor: pointer;
    }

    /* ===================== PC 主体区域 ===================== */
    .main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ===================== PC 左侧边栏 ===================== */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid rgba(255,255,255,0.06);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .sidebar-logo {
      text-align: center;
      padding: 12px 0 4px;
    }
    .sidebar-logo-emoji { font-size: 2.4rem; display: block; margin-bottom: 4px; }
    .sidebar-logo-text {
      font-size: 1rem; color: #fff; font-weight: 700;
      letter-spacing: 0.08em;
    }
    .sidebar-logo-sub {
      font-size: 0.65rem; color: rgba(255,255,255,0.35);
      margin-top: 2px;
    }
    .sidebar-divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 4px 0;
    }

    /* ===================== 右侧内容区 ===================== */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .content-area::-webkit-scrollbar { width: 4px; }
    .content-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    /* ===================== 通用卡片 ===================== */
    .card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 16px 18px;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .card:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      border-color: rgba(255,255,255,0.12);
    }
    .card-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 5px;
    }

    /* ===================== 心情记录 ===================== */
    .mood-card { }
    .mood-choices {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .mood-btn {
      font-size: 1.4rem;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      width: 42px; height: 42px;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .mood-btn:hover { transform: scale(1.2); border-color: rgba(248,165,194,0.6); background: rgba(248,165,194,0.1); }
    .mood-btn.selected { border-color: #f8a5c2; background: rgba(248,165,194,0.15); transform: scale(1.1); }
    .mood-today { font-size: 0.78rem; color: #f8a5c2; font-weight: 600; margin-bottom: 8px; min-height: 18px; }
    .mood-history { display: flex; gap: 6px; flex-wrap: wrap; }
    .mood-dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.08);
      font-size: 0.7rem;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
    }

    /* ===================== 音乐播放器 ===================== */
    .music-card {
      background: linear-gradient(135deg, rgba(102,126,234,0.5), rgba(118,75,162,0.5));
      border-color: rgba(102,126,234,0.2);
      display: flex; align-items: center; gap: 12px;
      cursor: pointer;
    }
    .music-card:active { transform: scale(0.98); }
    .play-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: #fff; flex-shrink: 0;
    }
    .music-info { flex: 1; color: #fff; }
    .music-title { font-size: 0.9rem; font-weight: 600; }
    .music-artist { font-size: 0.7rem; opacity: 0.7; }
    .music-time { font-size: 0.7rem; color: rgba(255,255,255,0.6); min-width: 36px; text-align: right; }

    /* ===================== 纪念日 ===================== */
    .anniversary-card {
      background: linear-gradient(135deg, rgba(240,147,251,0.3), rgba(245,87,108,0.3));
      border-color: rgba(240,147,251,0.2);
      color: #fff;
    }
    .a-title { font-size: 0.75rem; margin-bottom: 6px; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
    .a-countdown { font-size: 2.2rem; font-weight: 800; line-height: 1; }
    .a-label { font-size: 0.65rem; opacity: 0.6; }

    /* ===================== 默契问答 ===================== */
    .quiz-card {
      background: linear-gradient(135deg, rgba(17,153,142,0.4), rgba(56,239,125,0.3));
      border-color: rgba(56,239,125,0.15);
      color: #fff; cursor: pointer;
    }
    .quiz-card:active { transform: scale(0.98); }
    .q-title { font-size: 0.95rem; margin-bottom: 4px; font-weight: 600; }
    .q-desc { font-size: 0.65rem; opacity: 0.7; }

    /* ===================== 搜索 ===================== */
    .search-card { padding: 12px 16px; }
    .search-box { position: relative; }
    .search-box input {
      width: 100%; padding: 10px 14px; font-size: 0.9rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #fff; outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.3); }
    .search-box input:focus {
      border-color: rgba(120,80,255,0.5);
      box-shadow: 0 0 0 3px rgba(120,80,255,0.1);
    }
    .results { display: none; }
    .results.active { display: block; }
    .result-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 12px;
      margin-top: 8px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .result-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); }
    .r-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .r-avatar { font-size: 1.3rem; }
    .r-name { font-size: 0.9rem; font-weight: 600; color: #fff; }
    .r-tag { font-size: 0.62rem; color: rgba(255,255,255,0.4); }
    .r-preview { font-size: 0.75rem; color: rgba(255,255,255,0.45); }
    .not-found { display: none; text-align: center; padding: 16px; color: rgba(255,255,255,0.3); font-size: 0.8rem; }
    .not-found.active { display: block; }

    /* ===================== 留言板 ===================== */
    .msg-card { }
    .mb-name {
      width: 100%; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; font-size: 0.8rem;
      background: rgba(255,255,255,0.06); color: #fff; outline: none;
      box-sizing: border-box; margin-bottom: 8px;
    }
    .mb-name:focus { border-color: rgba(120,80,255,0.4); }
    .mb-input {
      width: 100%; padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; font-size: 0.8rem;
      background: rgba(255,255,255,0.06); color: #fff;
      resize: none; min-height: 60px; font-family: inherit; outline: none;
      box-sizing: border-box; margin-bottom: 8px;
    }
    .mb-input:focus { border-color: rgba(120,80,255,0.4); }
    .mb-input::placeholder, .mb-name::placeholder { color: rgba(255,255,255,0.3); }
    .mb-btn {
      width: 100%; padding: 10px;
      border: none; border-radius: 10px;
      background: linear-gradient(135deg, rgba(102,126,234,0.7), rgba(118,75,162,0.7));
      color: #fff; font-size: 0.85rem; cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .mb-btn:hover { opacity: 0.85; transform: scale(1.01); }
    .mb-msgs { margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px; }
    .mb-msg {
      padding: 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px; margin-bottom: 8px;
      position: relative;
    }
    .msg-name { font-size: 0.75rem; font-weight: 600; color: #a78bfa; }
    .msg-text { font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-top: 4px; line-height: 1.5; }
    .msg-time { font-size: 0.6rem; color: rgba(255,255,255,0.3); margin-top: 4px; }
    .delete-msg-btn {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; font-size: 0.7rem;
      cursor: pointer; opacity: 0.4; transition: opacity 0.2s;
    }
    .delete-msg-btn:hover { opacity: 1; }

    /* ===================== 秘密暗号 ===================== */
    .secret-card {
      background: linear-gradient(135deg, rgba(168,237,234,0.15), rgba(254,214,227,0.15));
      border-color: rgba(168,237,234,0.15);
      cursor: pointer; padding: 12px 16px;
      text-align: center; color: rgba(255,255,255,0.6); font-size: 0.78rem;
    }
    .secret-card:hover { color: rgba(255,255,255,0.85); border-color: rgba(168,237,234,0.3); }
    .secret-input { display: none; margin-top: 8px; }
    .secret-input.active { display: block; }
    .secret-input input {
      width: 100%; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
      background: rgba(255,255,255,0.06); color: #fff; font-size: 0.8rem; outline: none;
      box-sizing: border-box;
    }

    /* ===================== 管理入口 ===================== */
    .admin-link {
      text-align: center; margin-top: 8px; opacity: 0.15;
    }
    .admin-link-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 18px; border: none; border-radius: 20px;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
      font-size: 0.72rem; cursor: pointer; transition: all 0.2s;
    }
    .admin-link-btn:hover { opacity: 1; background: rgba(255,255,255,0.15); transform: scale(1.03); }

    /* ===================== 管理后台 ===================== */
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .admin-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .admin-header h2 { font-size: 0.9rem; color: #fff; }
    .admin-header button {
      padding: 4px 10px; border: none; border-radius: 8px;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
      font-size: 0.65rem; cursor: pointer;
    }
    .admin-section {
      background: rgba(255,255,255,0.03);
      border-radius: 10px; padding: 12px; margin-bottom: 12px;
    }
    .section-title { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
    .sync-status { font-size: 0.72rem; color: rgba(255,255,255,0.3); margin-bottom: 6px; }
    .sync-status.active { color: #38ef7d; }
    .token-input {
      width: 100%; padding: 7px 10px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      font-size: 0.72rem; background: rgba(255,255,255,0.06);
      color: #fff; margin-bottom: 6px; box-sizing: border-box; outline: none;
    }
    .sync-btn {
      width: 100%; padding: 7px;
      background: linear-gradient(135deg, rgba(39,174,96,0.6), rgba(46,204,113,0.6));
      color: #fff; border: none; border-radius: 8px;
      font-size: 0.78rem; cursor: pointer;
    }
    .friend-list { display: flex; flex-direction: column; gap: 5px; }
    .friend-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px; background: rgba(255,255,255,0.04);
      border-radius: 10px; cursor: pointer; transition: background 0.2s;
    }
    .friend-item:hover { background: rgba(255,255,255,0.08); }
    .friend-item .f-avatar { font-size: 0.95rem; }
    .friend-item .f-name { flex: 1; font-size: 0.78rem; color: rgba(255,255,255,0.8); }
    .edit-form {
      display: none; margin-top: 8px; padding: 10px;
      background: rgba(255,255,255,0.03); border-radius: 10px;
    }
    .edit-form.active { display: block; }
    .edit-form input, .edit-form textarea {
      width: 100%; padding: 7px 10px; margin-bottom: 5px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      font-size: 0.72rem; background: rgba(255,255,255,0.06);
      color: #fff; font-family: inherit; box-sizing: border-box; outline: none;
    }
    .edit-form textarea { min-height: 36px; }
    .edit-form .btns { display: flex; gap: 5px; margin-top: 4px; }
    .edit-form button { flex: 1; padding: 5px; border: none; border-radius: 6px; font-size: 0.68rem; cursor: pointer; }
    .edit-form .save { background: rgba(102,126,234,0.6); color: #fff; }
    .edit-form .cancel { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
    .edit-form .del-btn { background: rgba(255,100,100,0.15); color: #ff6b6b; border: 1px solid rgba(255,100,100,0.3); }
    .add-friend-btn {
      display: block; width: 100%; padding: 7px;
      margin-bottom: 6px;
      border: 2px dashed rgba(255,255,255,0.1); border-radius: 8px;
      background: transparent; color: rgba(255,255,255,0.35);
      font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
    }
    .add-friend-btn:hover { border-color: rgba(248,165,194,0.4); color: #f8a5c2; }
    .export-btn {
      display: block; width: 100%; padding: 7px; margin-top: 8px;
      border: none; border-radius: 8px; background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.5); font-size: 0.72rem; cursor: pointer;
    }

    /* ===================== 弹窗 ===================== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 100;
      align-items: center; justify-content: center;
      padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: rgba(26,26,46,0.97); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 24px 20px;
      max-width: 340px; width: 100%; text-align: center;
    }
    .modal .m-avatar { font-size: 2.4rem; margin-bottom: 4px; }
    .modal .m-name { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .modal .m-tag { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-bottom: 14px; }
    .modal .m-text { font-size: 0.85rem; color: rgba(255,255,255,0.7); line-height: 1.7; text-align: left; }
    .close-btn {
      margin-top: 18px; padding: 10px 28px; border: none; border-radius: 25px;
      background: linear-gradient(135deg, rgba(102,126,234,0.6), rgba(118,75,162,0.6));
      color: #fff; font-size: 0.8rem; cursor: pointer;
    }

    /* ===================== 开场帘子 ===================== */
    .curtain {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; cursor: pointer;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .curtain.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
    .curtain-title { font-size: 2.2rem; color: #fff; margin-bottom: 20px; text-shadow: 0 2px 20px rgba(0,0,0,0.2); }
    .curtain-hint { font-size: 0.9rem; color: rgba(255,255,255,0.8); animation: pulse 2s infinite; }
    .curtain-note { font-size: 0.72rem; color: rgba(255,255,255,0.6); margin-top: 28px; text-align: center; max-width: 260px; line-height: 1.6; }
    .curtain-music { position: absolute; bottom: 40px; display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.8); font-size: 0.78rem; }
    .curtain-music .dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: bounce 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    /* ===================== 提示文字 ===================== */
    .hint-text { text-align: center; color: rgba(255,255,255,0.25); font-size: 0.72rem; }

    /* ===================== Toast ===================== */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 10px 20px; border-radius: 25px;
      font-size: 0.8rem; z-index: 2000; pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }

    /* ===================== MBTI 答题 ===================== */
    .quiz-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .quiz-overlay.active { display: flex; }
    .quiz-box {
      background: rgba(20,20,40,0.97); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 24px 20px; max-width: 360px; width: 100%;
      color: #fff;
    }
    .quiz-box .q-num { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-bottom: 8px; }
    .quiz-box .q-text { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
    .quiz-box .option {
      padding: 12px; border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px; text-align: center; cursor: pointer;
      margin-bottom: 8px; transition: all 0.2s;
    }
    .quiz-box .option:hover { border-color: rgba(120,80,255,0.5); background: rgba(120,80,255,0.1); }
    .quiz-box .close-q {
      margin-top: 12px; width: 100%; padding: 8px;
      border: none; border-radius: 8px; background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6); cursor: pointer; font-size: 0.8rem;
    }

    /* ===================== 移动端底部导航 ===================== */
    .bottom-nav {
      display: none;
      height: 52px;

    @media (max-width: 768px) {

<body>

        <div class="nav-icon">✨</div>心情
      </button>
      <button class="bottom-nav-item" onclick="switchMobileTab('anniversary')" id="navAnniversary">

<!-- 弹窗 -->

  <div class="modal" onclick="event.stopPropagation()">
    <div class="m-avatar" id="s-emoji">🎁</div>
    <div class="m-name" id="s-title">惊喜时刻！</div>
    <div class="m-text" id="s-text"></div>
    <button class="close-btn" onclick="document.getElementById('secretModal').classList.remove('active')">太棒了</button>
  </div>
</div>

<!-- 弹窗提示 -->
<div class="toast" id="toast"></div>

<script>
// ==================== 数据 ====================
let friends = [];
let messages = [];
const GIST_ID = 'cf38eea9cb4db23811ff60fdd6d6cec3';
const GIST_API = 'https://api.github.com/gists/' + GIST_ID;
const GIST_RAW = `https://gist.githubusercontent.com/heart-sorry/${GIST_ID}/raw/data.json`;
const GIST_TOKEN = '';
const ADMIN_PASSWORD = '5201314';
const ANNIVERSARY_DATE = '2025-12-25';
const musicUrl = './music.mp3';

function getPending() {
  try { return JSON.parse(localStorage.getItem('msgs_pending') || '[]'); } catch { return []; }
}
function setPending(arr) { localStorage.setItem('msgs_pending', JSON.stringify(arr)); }
function addPending(msg) {
  const p = getPending();
  if (!p.find(m => m.id === msg.id)) p.push(msg);
  setPending(p);
}
function getMessages() {
  try { return JSON.parse(localStorage.getItem('msgs') || '[]'); } catch { return []; }
}
function setMessages(arr) { localStorage.setItem('msgs', JSON.stringify(arr)); }
function getFriends() {
  try { return JSON.parse(localStorage.getItem('friends') || '[]'); } catch { return []; }
}
function setFriends(arr) { localStorage.setItem('friends', JSON.stringify(arr)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== 时段问候语 ====================
const GREETINGS = [
  { after:23, text:'夜深了，早点休息哦 🌙' },
  { after:21, text:'晚安 💤' },
  { after:18, text:'傍晚好，吃了吗？🍽️' },
  { after:14, text:'下午好，辛苦了 ☕' },
  { after:11, text:'中午好，吃饱了吗 🍜' },
  { after:8,  text:'上午好 ☀️' },
  { after:6,  text:'早安，又是新的一天 🌅' },
  { after:0,  text:'你好呀 👋' }
];
function getGreeting() {
  const h = new Date().getHours();
  for (const g of GREETINGS) { if (h >= g.after) return g.text; }
  return '你好呀 👋';
}
function showGreeting() {
  const day = ['日','一','二','三','四','五','六'][new Date().getDay()];
  const text = getGreeting() + ' · ' + day + '曜日';
  const bar = document.getElementById('greetingBar');
  if (bar) bar.textContent = text;
  const barM = document.getElementById('greetingBarMobile');
  if (barM) barM.textContent = text;
}

// ==================== 心情记录 ====================
const MOODS = [
  { emoji:'😊', label:'开心' }, { emoji:'🥰', label:'心动' }, { emoji:'😢', label:'难过' },
  { emoji:'😡', label:'生气' }, { emoji:'😴', label:'疲惫' }, { emoji:'🤔', label:'思考' },
  { emoji:'😎', label:'得意' }, { emoji:'🥳', label:'兴奋' }
];
function getMoodData() {
  try { return JSON.parse(localStorage.getItem('mood_data') || '{}'); } catch { return {}; }
}
function saveMoodData(data) { localStorage.setItem('mood_data', JSON.stringify(data)); }
function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function showMood() {
  const data = getMoodData();
  const todayKey = getTodayKey();
  const todayMood = data[todayKey];

  function renderMood(sel) {
    const choices = document.getElementById(sel + 'Choices');
    const todayEl = document.getElementById(sel + 'Today');
    const histEl = document.getElementById(sel + 'History');
    if (!choices) return;
    choices.innerHTML = MOODS.map((m, i) =>
      `<button class="mood-btn${todayMood === i ? ' selected' : ''}" onclick="recordMood(${i})" title="${m.label}">${m.emoji}</button>`
    ).join('');
    if (todayMood !== undefined) {
      todayEl.textContent = `今天：${MOODS[todayMood].emoji} ${MOODS[todayMood].label}`;
    } else { todayEl.textContent = ''; }

    const days = [];
    for (let i = 1; i <= 7; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
      const mood = MOODS[data[k]];
      days.push({ mood, day: ['日','一','二','三','四','五','六'][d.getDay()] });
    }
    histEl.innerHTML = days.map(d => d.mood
      ? `<div class="mood-dot" title="${d.day}">${d.mood.emoji}<br><span style="font-size:0.5rem">${d.day}</span></div>`
      : `<div class="mood-dot" style="opacity:0.25" title="${d.day}"><span style="font-size:0.55rem">${d.day}</span></div>`
    ).join('');
  }
  renderMood('mood');
  renderMood('moodM');
}
function recordMood(index) {
  const data = getMoodData();
  data[getTodayKey()] = index;
  saveMoodData(data);
  showMood();
}

// ==================== 音乐 ====================
let audio = new Audio();
audio.src = musicUrl; audio.loop = true; audio.preload = 'auto';
audio.load();
let isPlaying = false;
let curtainOpened = false;

audio.onerror = () => { document.getElementById('musicTitle').textContent = '音乐加载失败'; };
audio.oncanplay = () => {
  document.getElementById('musicTitle').textContent = '点击播放音乐 🎵';
  const note = document.querySelector('.curtain-music span');
  if (note) note.textContent = '🎵 音乐已就绪';
};

let lastTime = 0;
audio.ontimeupdate = () => {
  if (!isPlaying) return;
  const now = Date.now();
  if (now - lastTime < 1000) return;
  lastTime = now;
  const m = Math.floor(audio.currentTime / 60);
  const s = Math.floor(audio.currentTime % 60).toString().padStart(2,'0');
  document.getElementById('musicTime').textContent = `${m}:${s}`;
};

function openCurtain() {
  if (curtainOpened) return;
  curtainOpened = true;
  audio.play().then(() => {
    isPlaying = true;
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('musicTitle').textContent = '🎵 鸟之诗';
  }).catch(() => {});
  document.getElementById('curtain').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('mainLayout').style.display = 'flex';
    showGreeting(); loadData(); showMood(); initAnniversary();
  }, 300);
}

function toggleMusic() {
  if (isPlaying) {
    audio.pause();
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('musicTitle').textContent = '点击播放音乐 🎵';
    isPlaying = false;
  } else {
    audio.play().then(() => {
      document.getElementById('playBtn').textContent = '⏸';
      document.getElementById('musicTitle').textContent = '🎵 鸟之诗';
      isPlaying = true;
    }).catch(() => { document.getElementById('musicTitle').textContent = '点击重试播放'; });
  }
}

// ==================== 纪念日 ====================
function initAnniversary() {
  const target = new Date(ANNIVERSARY_DATE);
  const today = new Date();
  const diff = Math.floor((target - today) / 86400000);
  const n = diff > 0 ? diff : 0;
  document.getElementById('countdown').textContent = n;
  if (document.getElementById('countdownM')) document.getElementById('countdownM').textContent = n;
}

// ==================== 搜索 ====================
const searchInput = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
const notFoundEl = document.getElementById('notFound');
const adminPanel = document.getElementById('adminPanel');
const hintEl = document.getElementById('hint');

const daysCache = new Map();
function getDays(dateStr) {
  if (!dateStr) return 0;
  if (daysCache.has(dateStr)) return daysCache.get(dateStr);
  const meet = new Date(dateStr);
  const today = new Date();
  const diff = Math.floor((today - meet) / 86400000);
  const result = diff > 0 ? diff : 0;
  daysCache.set(dateStr, result);
  return result;
}

function debounce(fn, delay = 200) {
  let timer = null;
  return function(...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

const handleSearch = debounce((query) => {
  if (query === ADMIN_PASSWORD) { showAdmin(); return; }
  if (!query) {
    resultsEl.classList.remove('active'); notFoundEl.classList.remove('active');
    hintEl.style.display = 'block'; return;
  }
  hintEl.style.display = 'none';
  const lowerQuery = query.toLowerCase();
  const matches = friends.filter(f => f.name.toLowerCase().includes(lowerQuery));
  if (matches.length === 0) {
    resultsEl.classList.remove('active'); notFoundEl.classList.add('active');
  } else {
    notFoundEl.classList.remove('active');
    resultsEl.innerHTML = matches.map(f => `
      <div class="result-item" onclick="openModal(friends.indexOf(${JSON.stringify(f).replace(/"/g,'&quot;')}))">
        <div class="r-top">
          <span class="r-avatar">${f.avatar}</span>
          <div>
            <div class="r-name">${f.name}</div>
            <div class="r-tag">${f.tag}${f.meetDate ? ' · 认识'+getDays(f.meetDate)+'天' : ''}</div>
          </div>
        </div>
        <div class="r-preview">${f.message ? f.message.substring(0,15) : '...' }...</div>
      </div>
    `).join('');
    resultsEl.classList.add('active');
  }
}, 200);

searchInput.addEventListener('input', (e) => handleSearch(e.target.value.trim()));
searchInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim();
    if (q === ADMIN_PASSWORD) { showAdmin(); }
    else {
      const match = friends.find(f => f.name.toLowerCase().includes(q.toLowerCase()));
      if (match) openModal(friends.indexOf(match));
    }
  }
});

// ==================== 弹窗 ====================
function openModal(i) {
  const f = friends[i];
  document.getElementById('m-avatar').textContent = f.avatar;
  document.getElementById('m-name').textContent = f.name;
  document.getElementById('m-tag').textContent = f.tag + (f.meetDate ? ' · 认识'+getDays(f.meetDate)+'天' : '');
  document.getElementById('m-text').textContent = f.message;
  document.getElementById('modal').classList.add('active');
}
function closeModal(e) { if (e.target.id === 'modal') document.getElementById('modal').classList.remove('active'); }

// ==================== 秘密暗号 ====================
function toggleSecret() {
  document.getElementById('secretInput').classList.toggle('active');
}
function checkSecret(e) {
  if (e.key !== 'Enter') return;
  const code = document.getElementById('secretCode').value.trim();

// ==================== MBTI 问答 ====================
const quizQuestions = [
  { q:'周末你更喜欢？', options:['和朋友一起出去玩','一个人安静待着'] },
  { q:'在聚会上你通常会？', options:['主动和陌生人聊天','只和认识的人交流'] },
  { q:'独处一天后，你感觉？', options:['有点无聊，想找人说话','精力充沛，充电完成'] },
  { q:'你更喜欢什么样的工作环境？', options:['热闹的团队协作','安静的独立思考'] },
  { q:'和朋友聊天时，你更多是？', options:['说很多，分享想法','倾听为主，默默陪伴'] },
  { q:'你看重的是？', options:['具体的事实和数据','未来的可能性'] },
  { q:'读小说时你更在意？', options:['情节怎么发展的','背后有什么含义'] },
  { q:'面对新项目，你更关注？', options:['具体的执行步骤','整体的创意和愿景'] },
  { q:'你更擅长记住？', options:['具体的细节和事实','抽象的概念和联系'] },
  { q:'解决问题时你习惯？', options:['用已有经验方法','尝试全新的方式'] },
  { q:'做重要决定时，你更看重？', options:['客观的逻辑和分析','内心的感受和价值观'] },
  { q:'朋友向你抱怨烦恼时，你更想说？', options:['我来帮你分析问题','我能理解你的感受'] },
  { q:'你觉得什么更重要？', options:['公平和原则','和谐和关系'] },
  { q:'当你不同意别人的观点时？', options:['直接说出来','委婉地表达'] },
  { q:'你更容易被什么打动？', options:['有道理的分析','真诚的情感表达'] },
  { q:'你更喜欢提前计划还是随机应变？', options:['提前计划好一切','随性而为，看情况'] },
  { q:'你的房间/桌面一般？', options:['整洁有序，井井有条','有点乱，但自己知道在哪'] },
  { q:'出门旅行你通常？', options:['提前订好所有行程','走一步看一步'] },
  { q:'面对最后期限的态度？', options:['必须按时完成','晚一点也没关系'] },
  { q:'你更喜欢的生活是？', options:['按部就班，有确定性','灵活自由，充满新鲜感'] }
];
let currentQ = 0, answers = [];
const userMBTI = 'ISTP';

function startQuiz() {
  currentQ = 0; answers = [];
  document.getElementById('quizNum').textContent = '第 1/20 题';
  document.getElementById('quizQ').textContent = quizQuestions[0].q;
  document.getElementById('quizOpts').innerHTML = quizQuestions[0].options.map((o,i) =>
    `<div class="option" onclick="selectOption(${i})">${o}</div>`
  ).join('');
  document.getElementById('quizOverlay').classList.add('active');
}
function selectOption(i) {
  answers.push(i);
  if (currentQ < quizQuestions.length - 1) {
    currentQ++;
    const dimNames = ['E/I 外向-内向','S/N 实际-直觉','T/F 理性-感性','J/P 判断-灵活'];
    const dim = Math.floor(currentQ / 5);
    document.getElementById('quizNum').textContent = `第 ${currentQ+1}/20 题 · ${dimNames[dim]}`;
    document.getElementById('quizQ').textContent = quizQuestions[currentQ].q;
    document.getElementById('quizOpts').innerHTML = quizQuestions[currentQ].options.map((o,idx) =>
      `<div class="option" onclick="selectOption(${idx})">${o}</div>`
    ).join('');
  } else {
    const mbti = calculateMBTI(answers);
    const match = compareMBTI(mbti, userMBTI);
    const mbtiDesc = {
      'INTJ':'建筑师','INTP':'逻辑学家','ENTJ':'指挥官','ENTP':'辩论家',
      'INFJ':'提倡者','INFP':'调停者','ENFJ':'主人公','ENFP':'竞选者',
      'ISTJ':'物流师','ISFJ':'守卫者','ESTJ':'总经理','ESFJ':'执政官',
      'ISTP':'鉴赏家','ISFP':'探险家','ESTP':'企业家','ESFP':'表演者'
    };
    const yourType = mbtiDesc[mbti] || '';
    document.getElementById('quizNum').textContent = `你的MBTI: ${mbti} ${yourType}`;
    document.getElementById('quizQ').textContent = `匹配度: ${match}%`;
    document.getElementById('quizOpts').innerHTML = `
      <div style="padding:12px;text-align:center;font-size:0.78rem;color:rgba(255,255,255,0.6)">
        <div>你的类型: <b>${mbti}</b> (${yourType})</div>
        <div style="margin-top:6px">对方类型: <b>${userMBTI}</b></div>
      </div>
    `;
  }
}
function calculateMBTI(answers) {
  const e = answers.slice(0,5).filter(a=>a===0).length;
  const s = answers.slice(5,10).filter(a=>a===0).length;
  const t = answers.slice(10,15).filter(a=>a===0).length;
  const j = answers.slice(15,20).filter(a=>a===0).length;
  return (e>=3?'E':'I')+(s>=3?'S':'N')+(t>=3?'T':'F')+(j>=3?'J':'P');
}
function compareMBTI(a, b) {
  let m = 0;
  for (let i = 0; i < 4; i++) if (a[i] === b[i]) m += 25;
  return m;
}
function closeQuiz() { document.getElementById('quizOverlay').classList.remove('active'); }

// ==================== 留言板 ====================
function submitMessage() {
  const name = document.getElementById('msgName').value.trim();
  const text = document.getElementById('msgText').value.trim();
  if (!name || !text) { showToast('请填写名字和留言～'); return; }
  const now = new Date();
  const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
  const time = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
  const msg = { id, name, text, time };
  messages.unshift(msg);
  setMessages(messages);
  renderMessages();
  addPending(msg);
  setTimeout(() => autoSync(), 500);
  document.getElementById('msgName').value = '';
  document.getElementById('msgText').value = '';
  showToast('留言成功！💕');
}
function renderMessages() {
  const isAdmin = adminPanel.classList.contains('active');
  document.getElementById('mbMsgs').innerHTML = messages.map(m => `
    <div class="mb-msg">
      <div class="msg-name">${m.name}</div>
      <div class="msg-text">${m.text}</div>
      <div class="msg-time">${m.time}</div>
      ${isAdmin ? `<button class="delete-msg-btn" onclick="deleteMessage('${m.id}')">🗑️</button>` : ''}
    </div>
  `).join('');
}
async function deleteMessage(id) {
  if (!confirm('确定删除这条留言吗？')) return;
  messages = messages.filter(m => m.id !== id);
  setMessages(messages);
  renderMessages();
  const synced = await pushToGist();
  if (!synced) showToast('删除成功，但同步失败');
}

// ==================== 数据同步 ====================
async function pushToGist() {
  const token = localStorage.getItem('gist_token') || GIST_TOKEN;
  if (!token) return false;
  try {
    const data = { messages, friends, updatedAt: new Date().toISOString() };
    const res = await fetch(GIST_API, {
      method: 'PATCH',
      headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: 'fun-data', files: { 'data.json': { content: JSON.stringify(data) } } })
    });
    return res.ok;
  } catch { return false; }
}
async function autoSync() {
  const token = localStorage.getItem('gist_token') || GIST_TOKEN;
  if (!token) return;
  const pending = getPending();
  if (pending.length === 0) return;
  try {
    const res = await fetch(GIST_RAW + '?t=' + Date.now());
    if (res.ok) {
      const cloud = await res.json();
      const cloudMsgs = Array.isArray(cloud) ? cloud : (cloud.messages || []);
      const cloudFriends = cloud.friends || friends;
      const cloudIds = new Set(cloudMsgs.map(m => m.id));
      const newOnes = pending.filter(m => !cloudIds.has(m.id));
      if (newOnes.length > 0) {
        messages = [...newOnes, ...cloudMsgs].slice(0, 200);
        friends = cloudFriends;
        if (await pushToGist()) {
          setPending([]);
          renderMessages();
          renderFriends();
        }
      }
    }
  } catch {}
}
async function loadData() {
  const localMsgs = getMessages();
  const localFriends = getFriends();
  if (localMsgs.length > 0) messages = localMsgs;
  if (localFriends.length > 0) friends = localFriends;
  try {
    const res = await fetch(GIST_RAW + '?t=' + Date.now());
    if (res.ok) {
      const cloud = await res.json();
      if (cloud.messages) {
        messages = cloud.messages;
        friends = cloud.friends || friends;
        setMessages(messages);
        setFriends(friends);
        renderMessages();
        renderFriends();
        autoSync();
        return;
      }
      if (Array.isArray(cloud)) { messages = cloud; setMessages(messages); renderMessages(); }
    }
  } catch {}
  renderMessages();
  renderFriends();
}

function saveSyncToken() {

  document.getElementById('syncStatus').textContent = '✅ 已开启';
  document.getElementById('syncStatus').classList.add('active');
  document.getElementById('gistToken').value = '';
