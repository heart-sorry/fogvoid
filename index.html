<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>致我们 💌</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ["'PingFang SC'","'Microsoft YaHei'",'sans-serif'] },
          colors: { surface: { 50:'rgba(255,255,255,0.03)',100:'rgba(255,255,255,0.06)',200:'rgba(255,255,255,0.10)',300:'rgba(255,255,255,0.15)'} },
        }
      }
    }
  </script>

  <style>
    /* ── 全局 ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      background: #050508;
      font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── 背景 ── */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 10% 20%, rgba(102,126,234,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 90% 80%, rgba(240,147,251,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 50% 50%, rgba(56,239,125,0.05) 0%, transparent 70%),
        #050508;
    }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.18;
      pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 500px; height: 500px; top: -150px; left: -100px; background: #667eea; }
    .orb-2 { width: 400px; height: 400px; bottom: -100px; right: -80px; background: #f093fb; }

    /* ── 滚动条 ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ── 毛玻璃 ── */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .glass-strong {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.10);
    }

    /* ── 3D 卡片 ── */
    .card-3d {
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.1s ease-out;
      cursor: pointer;
    }
    .card-3d .card-inner {
      transform: translateZ(30px);
      pointer-events: none;
    }
    .card-3d .glare {
      position: absolute; inset: 0;
      background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.18) 0%, transparent 60%);
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .card-3d:hover .glare { opacity: 1; }

    /* ── 瀑布流 ── */
    .masonry {
      columns: 1;
      column-gap: 16px;
    }
    @media (min-width: 640px) { .masonry { columns: 2; } }
    @media (min-width: 1024px) { .masonry { columns: 3; } }
    @media (min-width: 1400px) { .masonry { columns: 4; } }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 16px;
      /* GSAP 初始状态 */
      opacity: 0;
      transform: translateY(40px);
    }

    /* ── 同学卡片 ── */
    .friend-card {
      border-radius: 20px;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .friend-card:hover {
      border-color: rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .friend-card .avatar-ring {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(102,126,234,0.4), rgba(240,147,251,0.4));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(102,126,234,0.2);
    }
    .friend-card .f-name {
      font-size: 1.05rem; font-weight: 700; color: #fff;
      margin-bottom: 4px; letter-spacing: 0.02em;
    }
    .friend-card .f-tag {
      font-size: 0.68rem; color: rgba(255,255,255,0.4);
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 20px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 12px;
    }
    .friend-card .f-message {
      font-size: 0.78rem; color: rgba(255,255,255,0.55);
      line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .friend-card .f-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .friend-card .f-days {
      font-size: 0.65rem; color: rgba(255,255,255,0.3);
    }
    .friend-card .f-arrow {
      font-size: 0.75rem; color: rgba(255,255,255,0.2);
      transition: transform 0.2s, color 0.2s;
    }
    .friend-card:hover .f-arrow { transform: translateX(4px); color: rgba(255,255,255,0.6); }

    /* ── 顶部栏 ── */
    .header-glass {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 64px;
      background: rgba(5,5,8,0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    .header-title {
      font-size: 1.15rem; font-weight: 700; letter-spacing: 0.05em;
      background: linear-gradient(90deg, #667eea, #f093fb);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* ── 搜索 ── */
    .search-wrap {
      position: relative; width: 240px;
    }
    .search-input {
      width: 100%; padding: 8px 36px 8px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      color: #fff; font-size: 0.82rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, width 0.3s;
      font-family: inherit;
    }
    .search-input::placeholder { color: rgba(255,255,255,0.28); }
    .search-input:focus {
      border-color: rgba(102,126,234,0.5);
      box-shadow: 0 0 0 3px rgba(102,126,234,0.08);
      width: 280px;
    }
    .search-icon {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3); font-size: 0.8rem;
      pointer-events: none;
    }

    /* ── 搜索结果下拉 ── */
    .search-dropdown {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: rgba(15,15,25,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; overflow: hidden;
      display: none; z-index: 100;
    }
    .search-dropdown.active { display: block; }
    .search-result-item {
      padding: 12px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: rgba(255,255,255,0.05); }
    .search-result-item .ri-avatar { font-size: 1.2rem; }
    .search-result-item .ri-name { font-size: 0.85rem; font-weight: 600; color: #fff; }
    .search-result-item .ri-tag { font-size: 0.68rem; color: rgba(255,255,255,0.35); }
    .search-empty { padding: 16px; text-align: center; font-size: 0.78rem; color: rgba(255,255,255,0.3); }

    /* ── 心情记录 ── */
    .mood-section {
      border-radius: 20px; padding: 24px 20px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 16px;
    }
    .mood-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.08);
      font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .mood-btn:hover { transform: scale(1.2); border-color: rgba(248,165,194,0.5); }
    .mood-btn.sel { border-color: #f8a5c2; background: rgba(248,165,194,0.12); transform: scale(1.1); }

    /* ── 纪念日 ── */
    .anniversary-section {
      border-radius: 20px; padding: 28px 24px;
      background: linear-gradient(135deg, rgba(240,147,251,0.15), rgba(245,87,108,0.12));
      border: 1px solid rgba(240,147,251,0.15);
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── 音乐播放器条 ── */
    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      height: 60px;
      background: rgba(10,10,20,0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 14px;
      padding: 0 24px;
    }
    .player-play {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: none;
      color: #fff; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .player-play:active { transform: scale(0.95); }
    .player-info { flex: 1; min-width: 0; }
    .player-title { font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-time { font-size: 0.68rem; color: rgba(255,255,255,0.3); margin-top: 1px; }

    /* ── 留言板 ── */
    .msg-section {
      border-radius: 20px; padding: 24px 20px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .msg-input {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; color: #fff; font-size: 0.8rem;
      outline: none; font-family: inherit; resize: none;
      min-height: 64px; box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .msg-input:focus { border-color: rgba(102,126,234,0.4); }
    .msg-input::placeholder { color: rgba(255,255,255,0.28); }
    .msg-submit {
      width: 100%; margin-top: 8px; padding: 10px;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, rgba(102,126,234,0.7), rgba(118,75,162,0.7));
      color: #fff; font-size: 0.85rem; cursor: pointer;
      font-family: inherit; transition: opacity 0.2s;
    }
    .msg-submit:hover { opacity: 0.85; }
    .msg-item {
      padding: 12px; background: rgba(255,255,255,0.04);
      border-radius: 12px; margin-top: 10px;
      position: relative;
    }
    .msg-item .msg-name { font-size: 0.75rem; font-weight: 600; color: #a78bfa; }
    .msg-item .msg-text { font-size: 0.8rem; color: rgba(255,255,255,0.65); line-height: 1.5; margin-top: 4px; }
    .msg-item .msg-time { font-size: 0.65rem; color: rgba(255,255,255,0.28); margin-top: 4px; }
    .msg-item .del-msg {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; font-size: 0.65rem;
      color: rgba(255,255,255,0.25); cursor: pointer;
    }

    /* ── MBTI 问答 ── */
    .quiz-section {
      border-radius: 20px; padding: 24px 20px;
      background: linear-gradient(135deg, rgba(17,153,142,0.15), rgba(56,239,125,0.10));
      border: 1px solid rgba(56,239,125,0.12);
      cursor: pointer; text-align: center;
      margin-bottom: 16px;
      transition: transform 0.2s;
    }
    .quiz-section:active { transform: scale(0.98); }

    /* ── 秘密暗号 ── */
    .secret-section {
      border-radius: 20px; padding: 20px;
      background: linear-gradient(135deg, rgba(168,237,234,0.10), rgba(254,214,227,0.10));
      border: 1px solid rgba(168,237,234,0.10);
      text-align: center; cursor: pointer;
      margin-bottom: 16px;
    }
    .secret-input-field {
      display: none; margin-top: 10px;
    }
    .secret-input-field input {
      width: 100%; padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #fff; font-size: 0.8rem;
      outline: none; box-sizing: border-box; font-family: inherit;
    }
    .secret-input-field input::placeholder { color: rgba(255,255,255,0.3); }

    /* ── 管理入口 ── */
    .admin-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 16px; border: none; border-radius: 20px;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4);
      font-size: 0.68rem; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .admin-btn:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }

    /* ── 管理后台 ── */
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .admin-inner {
      border-radius: 20px; padding: 24px 20px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .admin-field {
      margin-bottom: 8px;
    }
    .admin-field input, .admin-field textarea {
      width: 100%; padding: 8px 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: #fff; font-size: 0.72rem;
      outline: none; font-family: inherit; box-sizing: border-box;
    }
    .admin-field textarea { min-height: 36px; resize: vertical; }
    .admin-field input:focus, .admin-field textarea:focus { border-color: rgba(102,126,234,0.4); }
    .admin-btn-row { display: flex; gap: 6px; margin-top: 6px; }
    .admin-btn-row button {
      flex: 1; padding: 6px; border: none; border-radius: 8px;
      font-size: 0.7rem; cursor: pointer; font-family: inherit;
    }
    .btn-save { background: rgba(102,126,234,0.6); color: #fff; }
    .btn-cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
    .btn-del { background: rgba(255,80,80,0.15); color: #ff6b6b; border: 1px solid rgba(255,80,80,0.25); }
    .friend-list-item {
      padding: 8px 10px; background: rgba(255,255,255,0.04);
      border-radius: 10px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; transition: background 0.15s;
    }
    .friend-list-item:hover { background: rgba(255,255,255,0.08); }
    .friend-list-item .fli-avatar { font-size: 0.95rem; }
    .friend-list-item .fli-name { flex: 1; font-size: 0.78rem; color: rgba(255,255,255,0.75); }
    .add-friend-btn {
      width: 100%; padding: 8px; margin-bottom: 8px;
      border: 2px dashed rgba(255,255,255,0.1); border-radius: 10px;
      background: transparent; color: rgba(255,255,255,0.3);
      font-size: 0.78rem; cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .add-friend-btn:hover { border-color: rgba(248,165,194,0.4); color: #f8a5c2; }

    /* ── 弹窗 ── */
    .modal-bg {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-bg.active { display: flex; }
    .modal-box {
      background: rgba(10,10,20,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 32px 24px;
      max-width: 380px; width: 100%; text-align: center;
    }
    .modal-box .m-avatar { font-size: 3rem; margin-bottom: 8px; }
    .modal-box .m-name { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .modal-box .m-tag { font-size: 0.68rem; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .modal-box .m-text { font-size: 0.85rem; color: rgba(255,255,255,0.65); line-height: 1.7; margin-top: 16px; text-align: left; }
    .modal-close {
      margin-top: 20px; padding: 10px 32px;
      border: none; border-radius: 24px;
      background: linear-gradient(135deg, rgba(102,126,234,0.7), rgba(118,75,162,0.7));
      color: #fff; font-size: 0.82rem; cursor: pointer;
      font-family: inherit;
    }

    /* ── MBTI 答题弹窗 ── */
    .quiz-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .quiz-overlay.active { display: flex; }
    .quiz-box {
      background: rgba(10,10,24,0.97);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 28px 24px;
      max-width: 400px; width: 100%; color: #fff;
    }
    .quiz-num { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-bottom: 10px; }
    .quiz-text { font-size: 1rem; font-weight: 600; margin-bottom: 18px; }
    .quiz-option {
      padding: 14px; border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px; text-align: center; cursor: pointer;
      margin-bottom: 8px; transition: all 0.2s;
      font-size: 0.85rem;
    }
    .quiz-option:hover { border-color: rgba(102,126,234,0.5); background: rgba(102,126,234,0.08); }
    .quiz-close { margin-top: 14px; width: 100%; padding: 8px; border: none; border-radius: 10px; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.55); font-size: 0.8rem; cursor: pointer; font-family: inherit; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.10); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff; padding: 10px 22px; border-radius: 24px;
      font-size: 0.82rem; z-index: 3000; pointer-events: none;
      opacity: 0; transition: opacity 0.3s; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── 开场帘子 ── */
    .curtain {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 50%, #0f1628 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; transition: opacity 0.8s ease;
    }
    .curtain.hidden { opacity: 0; pointer-events: none; }
    .curtain-emoji { font-size: 3.5rem; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
    .curtain-title { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 16px; letter-spacing: 0.1em; background: linear-gradient(90deg, #667eea, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .curtain-hint { font-size: 0.9rem; color: rgba(255,255,255,0.6); animation: pulse 2s infinite; }
    .curtain-note { font-size: 0.72rem; color: rgba(255,255,255,0.35); margin-top: 24px; text-align: center; max-width: 260px; line-height: 1.7; }
    .curtain-music { position: absolute; bottom: 40px; display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.5); font-size: 0.75rem; }
    .curtain-dot { width: 8px; height: 8px; background: #667eea; border-radius: 50%; animation: bounce 1s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    /* ── 主内容区 ── */
    .main-content {
      position: relative; z-index: 1;
      padding: 88px 24px 80px;
      max-width: 1440px; margin: 0 auto;
    }

    /* ── 页面标题区 ── */
    .page-hero {
      text-align: center; margin-bottom: 48px;
      padding: 40px 0 20px;
    }
    .page-hero h2 { font-size: 0.7rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.25); text-transform: uppercase; margin-bottom: 10px; }

<script>

const GIST_ID = 'cf38eea9cb4db23811ff60fdd6d6cec3';

function getPending() { try { return JSON.parse(localStorage.getItem('msgs_pending')||'[]'); } catch { return []; } }

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
const GREETINGS = [
  {after:23,text:'夜深了，早点休息哦 🌙'},{after:21,text:'晚安 💤'},
  {after:18,text:'傍晚好，吃了吗？🍽️'},{after:14,text:'下午好，辛苦了 ☕'},

function getGreeting() {

// ═══════════════════════════════════════════════════

const MOODS = [

  {emoji:'😡',label:'生气'},{emoji:'😴',label:'疲惫'},{emoji:'🤔',label:'思考'},
  {emoji:'😎',label:'得意'},{emoji:'🥳',label:'兴奋'}
];
function getMoodData() { try { return JSON.parse(localStorage.getItem('mood_data')||'{}'); } catch { return {}; } }
function saveMoodData(d) { localStorage.setItem('mood_data', JSON.stringify(d)); }
function getTodayKey() { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function showMood() {
  const data = getMoodData();
  const todayKey = getTodayKey();
  const todayMood = data[todayKey];

  const choicesEl = document.getElementById('moodChoices');
  choicesEl.innerHTML = MOODS.map((m,i)=>
    `<button class="mood-btn${todayMood===i?' sel':''}" onclick="recordMood(${i})" title="${m.label}">${m.emoji}</button>`
  ).join('');

  const todayEl = document.getElementById('moodToday');
  todayEl.textContent = todayMood!==undefined ? `今天：${MOODS[todayMood].emoji} ${MOODS[todayMood].label}` : '';

  const histEl = document.getElementById('moodHistory');
  const days = [];
  for(let i=1;i<=7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    const day=['日','一','二','三','四','五','六'][d.getDay()];
    days.push({mood:MOODS[data[k]], day});
  }
  histEl.innerHTML = days.map(d=> d.mood
    ? `<div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.7rem;" title="${d.day}">${d.mood.emoji}<span style="font-size:0.4rem">${d.day}</span></div>`
    : `<div style="width:30px;height:30px;border-radius:50%;opacity:0.2;display:flex;align-items:center;justify-content:center;font-size:0.55rem;color:rgba(255,255,255,0.3);" title="${d.day}">${d.day}</div>`
  ).join('');
}
function recordMood(index) {
  const data=getMoodData();
  data[getTodayKey()]=index;
  saveMoodData(data);
  showMood();
}

// ═══════════════════════════════════════════════════

let curtainOpened = false;

audio.onerror = () => { document.getElementById('musicTitle').textContent = '音乐加载失败'; };

// ═══════════════════════════════════════════════════
//  3D 倾斜效果
// ═══════════════════════════════════════════════════
function init3DTilt() {
  const cards = document.querySelectorAll('.card-3d');
  cards.forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const rotateX = (y - cy) / cy * -10;
      const rotateY = (x - cx) / cx * 10;
      card.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02,1.02,1.02)`;
      // 更新 glare 位置
      const mx = (x/rect.width*100).toFixed(1);
      const my = (y/rect.height*100).toFixed(1);
      card.style.setProperty('--mx', mx+'%');
      card.style.setProperty('--my', my+'%');
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
    });
  });
}

// ═══════════════════════════════════════════════════
//  搜索
// ═══════════════════════════════════════════════════
const searchInput = document.getElementById('searchInput');

const adminPanel = document.getElementById('adminPanel');

const daysCache = new Map();
function getDays(dateStr) {
  if(!dateStr) return 0;
  if(daysCache.has(dateStr)) return daysCache.get(dateStr);
  const d = new Date(dateStr);
  const diff = Math.floor((new Date()-d)/86400000);
  const r = diff>0?diff:0;
  daysCache.set(dateStr, r);
  return r;
}

function debounce(fn, delay=200) {
  let timer=null;
  return function(...args) {
    if(timer) clearTimeout(timer);
    timer = setTimeout(()=>fn.apply(this,args), delay);
  };
}

const handleSearch = debounce((query) => {
  if(query===ADMIN_PASSWORD) { showAdmin(); searchDropdown.classList.remove('active'); return; }
  if(!query) { searchDropdown.classList.remove('active'); return; }
  const lower = query.toLowerCase();
  const matches = friends.filter(f=>f.name.toLowerCase().includes(lower));
  if(matches.length===0) {
    searchResults.innerHTML = '';
    searchEmpty.style.display = 'block';
  } else {
    searchEmpty.style.display = 'none';
    searchResults.innerHTML = matches.map(f=>`
      <div class="search-result-item" onclick="openModal(friends.indexOf(${JSON.stringify(f).replace(/"/g,'&quot;')}))">
        <span class="ri-avatar">${f.avatar}</span>
        <div>
          <div class="ri-name">${f.name}</div>
          <div class="ri-tag">${f.tag}${f.meetDate?' · 认识'+getDays(f.meetDate)+'天':''}</div>
        </div>
      </div>
    `).join('');
  }
  searchDropdown.classList.add('active');
}, 200);

searchInput.addEventListener('input', (e)=>handleSearch(e.target.value.trim()));
searchInput.addEventListener('keypress', (e)=>{
  if(e.key==='Enter') {
    const q=searchInput.value.trim();
    if(q===ADMIN_PASSWORD) { showAdmin(); searchDropdown.classList.remove('active'); }
    else {
      const m=friends.find(f=>f.name.toLowerCase().includes(q.toLowerCase()));
      if(m) { openModal(friends.indexOf(m)); searchDropdown.classList.remove('active'); }
    }
  }
});
searchInput.addEventListener('blur', ()=>setTimeout(()=>searchDropdown.classList.remove('active'), 200));

function openModal(i) {
  const f = friends[i];
  document.getElementById('m-avatar').textContent = f.avatar;
  document.getElementById('m-name').textContent = f.name;
  document.getElementById('m-tag').textContent = f.tag + (f.meetDate?' · 认识'+getDays(f.meetDate)+'天':'');
  document.getElementById('m-text').textContent = f.message;
  document.getElementById('modal').classList.add('active');
}
function closeModal(e) { if(e.target.id==='modal') document.getElementById('modal').classList.remove('active'); }

//  秘密暗号
// ═══════════════════════════════════════════════════
function toggleSecret() {
  document.getElementById('secretInputField').classList.toggle('active');
}
function checkSecret(e) {
  if(e.key!=='Enter') return;
  const code = document.getElementById('secretCode').value.trim();
  const matched = friends.find(f=>f.secretCode&&f.secretCode===code);
  if(matched) {
    document.getElementById('s-emoji').textContent = matched.avatar;
    document.getElementById('s-title').textContent = matched.name+'的专属惊喜！';
    document.getElementById('s-text').textContent = matched.secretMessage||matched.message||'你找到了我们的秘密暗号！';
    document.getElementById('secretModal').classList.add('active');
    document.getElementById('secretInputField').classList.remove('active');
    document.getElementById('secretCode').value = '';
  } else if(code===ADMIN_PASSWORD) {
    showAdmin(); document.getElementById('secretInputField').classList.remove('active');
    document.getElementById('secretCode').value = '';
  } else {
    showToast('暗号不对哦～再想想？');
  }
}
function closeSecret(e) { if(e.target.id==='secretModal') document.getElementById('secretModal').classList.remove('active'); }

const quizQuestions = [

  {q:'在聚会上你通常会？',options:['主动和陌生人聊天','只和认识的人交流']},
  {q:'独处一天后，你感觉？',options:['有点无聊，想找人说话','精力充沛，充电完成']},
  {q:'你更喜欢什么样的工作环境？',options:['热闹的团队协作','安静的独立思考']},
  {q:'和朋友聊天时，你更多是？',options:['说很多，分享想法','倾听为主，默默陪伴']},
  {q:'你看重的是？',options:['具体的事实和数据','未来的可能性']},
  {q:'读小说时你更在意？',options:['情节怎么发展的','背后有什么含义']},
  {q:'面对新项目，你更关注？',options:['具体的执行步骤','整体的创意和愿景']},
  {q:'你更擅长记住？',options:['具体的细节和事实','抽象的概念和联系']},
  {q:'解决问题时你习惯？',options:['用已有经验方法','尝试全新的方式']},
  {q:'做重要决定时，你更看重？',options:['客观的逻辑和分析','内心的感受和价值观']},
  {q:'朋友向你抱怨烦恼时，你更想说？',options:['我来帮你分析问题','我能理解你的感受']},
  {q:'你觉得什么更重要？',options:['公平和原则','和谐和关系']},
  {q:'当你不同意别人的观点时？',options:['直接说出来','委婉地表达']},
  {q:'你更容易被什么打动？',options:['有道理的分析','真诚的情感表达']},
  {q:'你更喜欢提前计划还是随机应变？',options:['提前计划好一切','随性而为，看情况']},
  {q:'你的房间/桌面一般？',options:['整洁有序，井井有条','有点乱，但自己知道在哪']},
  {q:'出门旅行你通常？',options:['提前订好所有行程','走一步看一步']},
  {q:'面对最后期限的态度？',options:['必须按时完成','晚一点也没关系']},
  {q:'你更喜欢的生活是？',options:['按部就班，有确定性','灵活自由，充满新鲜感']}
];
let currentQ=0, answers=[];
const userMBTI='ISTP';

function startQuiz() {
  currentQ=0; answers=[];
  document.getElementById('quizNum').textContent='第 1/20 题';
  document.getElementById('quizText').textContent=quizQuestions[0].q;
  document.getElementById('quizOpts').innerHTML=quizQuestions[0].options.map((o,i)=>
    `<div class="quiz-option" onclick="selectOption(${i})">${o}</div>`
  ).join('');
  document.getElementById('quizOverlay').classList.add('active');
}
function selectOption(i) {
  answers.push(i);
  if(currentQ<quizQuestions.length-1) {
    currentQ++;
    const dimNames=['E/I','S/N','T/F','J/P'];
    const dim=Math.floor(currentQ/5);
    document.getElementById('quizNum').textContent=`第 ${currentQ+1}/20 题 · ${dimNames[dim]}`;
    document.getElementById('quizText').textContent=quizQuestions[currentQ].q;
    document.getElementById('quizOpts').innerHTML=quizQuestions[currentQ].options.map((o,idx)=>
      `<div class="quiz-option" onclick="selectOption(${idx})">${o}</div>`
    ).join('');
  } else {
    const mbti=calculateMBTI(answers);
    const match=compareMBTI(mbti,userMBTI);
    const mbtiDesc={'INTJ':'建筑师','INTP':'逻辑学家','ENTJ':'指挥官','ENTP':'辩论家',
      'INFJ':'提倡者','INFP':'调停者','ENFJ':'主人公','ENFP':'竞选者',
      'ISTJ':'物流师','ISFJ':'守卫者','ESTJ':'总经理','ESFJ':'执政官',
      'ISTP':'鉴赏家','ISFP':'探险家','ESTP':'企业家','ESFP':'表演者'};
    document.getElementById('quizNum').innerHTML=`你的MBTI: <b>${mbti}</b> (${mbtiDesc[mbti]||''})`;
    document.getElementById('quizText').innerHTML=`匹配度: <b style="color:#f8a5c2">${match}%</b><br><div style="font-size:0.75rem;color:rgba(255,255,255,0.35);margin-top:4px">对方类型: <b>${userMBTI}</b></div>`;
    document.getElementById('quizOpts').innerHTML='<div style="text-align:center;padding:16px;color:rgba(255,255,255,0.5);font-size:0.8rem;">测试完成！</div>';
  }
}
function calculateMBTI(a) {
  const e=a.slice(0,5).filter(x=>x===0).length;
  const s=a.slice(5,10).filter(x=>x===0).length;
  const t=a.slice(10,15).filter(x=>x===0).length;
  const j=a.slice(15,20).filter(x=>x===0).length;
  return (e>=3?'E':'I')+(s>=3?'S':'N')+(t>=3?'T':'F')+(j>=3?'J':'P');
}
function compareMBTI(a,b) { let m=0; for(let i=0;i<4;i++) if(a[i]===b[i]) m+=25; return m; }
function closeQuiz() { document.getElementById('quizOverlay').classList.remove('active'); }

// ═══════════════════════════════════════════════════
//  留言板
// ═══════════════════════════════════════════════════
function submitMessage() {
  const name=document.getElementById('msgName').value.trim();
  const text=document.getElementById('msgText').value.trim();
  if(!name||!text) { showToast('请填写名字和留言～'); return; }
  const now=new Date();
  const id=Date.now().toString(36)+Math.random().toString(36).substr(2);
  const time=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
  const msg={id,name,text,time};
  messages.unshift(msg);
  setMessages(messages);
  renderMessages();
  addPending(msg);
  setTimeout(()=>autoSync(),500);
  document.getElementById('msgName').value='';
  document.getElementById('msgText').value='';
  showToast('留言成功！💕');
}
function renderMessages() {
  const isAdmin=adminPanel.classList.contains('active');
  document.getElementById('mbMsgs').innerHTML=messages.slice(0,20).map(m=>`
    <div class="msg-item">
      <div class="msg-name">${m.name}</div>
      <div class="msg-text">${m.text}</div>
      <div class="msg-time">${m.time}</div>
      ${isAdmin?`<button class="del-msg" onclick="deleteMessage('${m.id}')">🗑️</button>`:''}
    </div>
  `).join('');
}
async function deleteMessage(id) {
  if(!confirm('确定删除这条留言吗？')) return;
  messages=messages.filter(m=>m.id!==id);
  setMessages(messages);
  renderMessages();
  const synced=await pushToGist();
  if(!synced) showToast('删除成功，但同步失败');
}

// ═══════════════════════════════════════════════════
//  数据同步
// ═══════════════════════════════════════════════════
async function pushToGist() {
  const token=localStorage.getItem('gist_token')||GIST_TOKEN;
  if(!token) return false;
  try {
    const data={messages, friends, updatedAt: new Date().toISOString()};
    const res=await fetch(GIST_API,{
      method:'PATCH',
      headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({description:'fun-data',files:{'data.json':{content:JSON.stringify(data)}}})
    });
    return res.ok;
  } catch { return false; }
}
async function autoSync() {
  const token=localStorage.getItem('gist_token')||GIST_TOKEN;
  if(!token) return;
  const pending=getPending();
  if(pending.length===0) return;
  try {
    const res=await fetch(GIST_RAW+'?t='+Date.now());
    if(res.ok) {
      const cloud=await res.json();
      const cloudMsgs=Array.isArray(cloud)?cloud:(cloud.messages||[]);
      const cloudFriends=cloud.friends||friends;
      const cloudIds=new Set(cloudMsgs.map(m=>m.id));
      const newOnes=pending.filter(m=>!cloudIds.has(m.id));
      if(newOnes.length>0) {
        messages=[...newOnes,...cloudMsgs].slice(0,200);
        friends=cloudFriends;
        if(await pushToGist()) { setPending([]); renderMessages(); renderFriends(); }
      }
    }
  } catch {}
}
async function loadData() {
  const localMsgs=getMessages();
  const localFriends=getFriends();
  if(localMsgs.length>0) messages=localMsgs;
  if(localFriends.length>0) friends=localFriends;
  try {
    const res=await fetch(GIST_RAW+'?t='+Date.now());
    if(res.ok) {
      const cloud=await res.json();
      if(cloud.messages) {
        messages=cloud.messages; friends=cloud.friends||friends;
        setMessages(messages); setFriends(friends);
        renderMessages(); renderFriends(); renderFriendsMasonry();
        autoSync();
        // 等 masonry 渲染完成后重新初始化 GSAP 和 3D tilt
        setTimeout(()=>{ initGSAP(); init3DTilt(); }, 100);
        return;
      }
      if(Array.isArray(cloud)) { messages=cloud; setMessages(messages); }
    }
  } catch {}
  renderMessages(); renderFriends(); renderFriendsMasonry();
  setTimeout(()=>{ initGSAP(); init3DTilt(); }, 100);
}

// ═══════════════════════════════════════════════════
//  渲染瀑布流同学卡片
// ═══════════════════════════════════════════════════
function renderFriendsMasonry() {
  const masonry = document.getElementById('friendMasonry');
  const empty = document.getElementById('friendEmpty');
  if(!masonry) return;
  if(friends.length===0) {
    masonry.innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';
  masonry.innerHTML=friends.map((f,i)=>`
    <div class="masonry-item">
      <div class="friend-card card-3d" onclick="openModal(${i})">
        <div class="glare"></div>
        <div class="card-inner">
          <div class="avatar-ring">${f.avatar}</div>
          <div class="f-name">${f.name}</div>
          <div class="f-tag">${f.tag}</div>
          <div class="f-message">${f.message||'...'}</div>
          <div class="f-footer">
            <div class="f-days">${f.meetDate?'认识 '+getDays(f.meetDate)+' 天':'✨'}</div>
            <div class="f-arrow">→</div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════
//  管理后台
// ═══════════════════════════════════════════════════
function promptAdminPassword() {
  const input=prompt('请输入管理密码：');
  if(input===ADMIN_PASSWORD) { showAdmin(); }
  else if(input!==null) { showToast('密码错误'); }
}
function showAdmin() {
  adminPanel.classList.add('active');
  adminPanel.scrollIntoView({behavior:'smooth'});
  renderFriends();
  renderMessages();
  const token=localStorage.getItem('gist_token');
  const status=document.getElementById('syncStatus');
  if(token) { status.textContent='✅ 已开启'; status.style.color='#38ef7d'; }
  else { status.textContent='未开启'; status.style.color='rgba(255,255,255,0.28)'; }
}
function logoutAdmin() { adminPanel.classList.remove('active'); }
function renderFriends() {
  document.getElementById('friendList').innerHTML=friends.map((f,i)=>`
    <div class="friend-list-item" onclick="editFriend(${i})">
      <span class="fli-avatar">${f.avatar}</span>
      <span class="fli-name">${f.name}</span>
    </div>
  `).join('');
}
function addFriend() {
  friends.push({avatar:'👤',name:'',tag:'',meetDate:'',secretCode:'',message:'',secretMessage:''});
  editFriend(friends.length-1);
}
function deleteFriend(i) {
  if(!confirm('确定删除 '+friends[i].name+' 吗？')) return;
  friends.splice(i,1); cancelEdit(); renderFriends(); renderFriendsMasonry(); saveFriends();
  setTimeout(()=>{ initGSAP(); init3DTilt(); }, 50);
}
function editFriend(i) {
  const f=friends[i];
  document.getElementById('editIndex').value=i;
  document.getElementById('editAvatar').value=f.avatar;
  document.getElementById('editName').value=f.name;
  document.getElementById('editTag').value=f.tag;
  document.getElementById('editMeetDate').value=f.meetDate||'';
  document.getElementById('editSecretCode').value=f.secretCode||'';
  document.getElementById('editMessage').value=f.message||'';
  document.getElementById('editSecretMessage').value=f.secretMessage||'';
  document.getElementById('editForm').style.display='block';
}
function saveFriend() {
  const i=parseInt(document.getElementById('editIndex').value);
  friends[i]={
    avatar:document.getElementById('editAvatar').value||'👤',
    name:document.getElementById('editName').value||'未命名',
    tag:document.getElementById('editTag').value||'',
    meetDate:document.getElementById('editMeetDate').value||'',
    secretCode:document.getElementById('editSecretCode').value||'',
    message:document.getElementById('editMessage').value||'',
    secretMessage:document.getElementById('editSecretMessage').value||''
  };
  cancelEdit(); renderFriends(); renderFriendsMasonry(); saveFriends();
  showToast('保存成功！✅');
  setTimeout(()=>{ initGSAP(); init3DTilt(); }, 50);
}
function cancelEdit() { document.getElementById('editForm').style.display='none'; }
function deleteFriendFromForm() { const i=parseInt(document.getElementById('editIndex').value); deleteFriend(i); }
function saveFriends() { localStorage.setItem('friends',JSON.stringify(friends)); }
function copyData() {
  const data=`const friends = ${JSON.stringify(friends,null,2)};`;
  navigator.clipboard.writeText(data).then(()=>{showToast('✅ 已复制！');});
}
function saveSyncToken() {
  const token=document.getElementById('gistToken').value.trim();
  if(!token) { showToast('请输入 GitHub Token'); return; }
  if(!token.startsWith('ghp_')) { showToast('Token 格式错误'); return; }
  localStorage.setItem('gist_token',token);
  document.getElementById('syncStatus').textContent='✅ 已开启';
  document.getElementById('syncStatus').style.color='#38ef7d';
  document.getElementById('gistToken').value='';
  showToast('✅ 同步已开启！');
}
</script>
